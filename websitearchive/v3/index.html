<!-- JS for Nebular Particle Background -->
<script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: null, y: null };
        
        // Colors for light theme: tech-blues (#006687), soft golds (#d8913f), light grays
        const colors = [
            'rgba(0, 102, 135, 0.4)',   // tech blue
            'rgba(216, 145, 63, 0.4)',  // gold
            'rgba(111, 120, 127, 0.3)'  // subtle gray
        ];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            // Create dust particles (denser for light mode to be visible)
            const particleCount = Math.floor((width * height) / 3500); 
            
            for (let i = 0; i < particleCount; i++) {
                const radius = Math.random() * 2 + 0.5; // Slightly larger sizes
                const x = Math.random() * width;
                const y = Math.random() * height;
                const dx = (Math.random() - 0.5) * 0.4; // Slightly faster
                const dy = (Math.random() - 0.5) * 0.4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                particles.push(new Particle(x, y, dx, dy, radius, color));
            }
            
            // Add a few 'gas' glows
            for(let i=0; i < 6; i++) {
                 const radius = Math.random() * 150 + 80; 
                 const x = Math.random() * width;
                 const y = Math.random() * height;
                 const dx = (Math.random() - 0.5) * 0.15; 
                 const dy = (Math.random() - 0.5) * 0.15;
                 const color = i % 2 === 0 ? 'rgba(0, 102, 135, 0.04)' : 'rgba(216, 145, 63, 0.03)';
                 
                 particles.push(new GasParticle(x, y, dx, dy, radius, color));
            }
        }

        class Particle {
            constructor(x, y, dx, dy, radius, color) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.baseY = y;
                this.dx = dx;
                this.dy = dy;
                this.radius = radius;
                this.color = color;
                this.density = (Math.random() * 20) + 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                // Natural slow movement
                this.x += this.dx;
                this.y += this.dy;

                // Screen wrapping
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
                if (this.y > height) this.y = 0;
                if (this.y < 0) this.y = height;

                // Mouse interaction (gentle repulsion)
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let maxDistance = 150;

                    if (distance < maxDistance) {
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let force = (maxDistance - distance) / maxDistance;
                        let directionX = forceDirectionX * force * this.density * 0.5;
                        let directionY = forceDirectionY * force * this.density * 0.5;

                        this.x -= directionX;
                        this.y -= directionY;
                    }
                }

                this.draw();
            }
        }
        
        class GasParticle extends Particle {
            draw() {
                ctx.beginPath();
                
                // Create radial gradient for soft glow effect
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            update() {
                 this.x += this.dx;
                 this.y += this.dy;

                 if (this.x > width + this.radius) this.x = -this.radius;
                 if (this.x < -this.radius) this.x = width + this.radius;
                 if (this.y > height + this.radius) this.y = -this.radius;
                 if (this.y < -this.radius) this.y = height + this.radius;
                 
                 this.draw();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Light background clear to leave trails
            ctx.fillStyle = 'rgba(252, 249, 248, 0.4)'; // matches surface background
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            
            connectParticles();
        }
        
        function connectParticles() {
            let opacityValue = 1;
            for(let a = 0; a < particles.length; a++) {
                // Skip gas particles
                if(particles[a] instanceof GasParticle) continue;
                
                for(let b = a; b < particles.length; b++) {
                    if(particles[b] instanceof GasParticle) continue;
                    
                    let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x))
                                 + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                                 
                    if(distance < (width/12) * (height/12)) {
                        // Very subtle dark lines for light mode
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = `rgba(0, 102, 135, ${opacityValue * 0.08})`; // subtle blue line
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Event Listeners
        window.addEventListener('resize', () => {
            init();
        });

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Start
        init();
        animate();
    </script>
